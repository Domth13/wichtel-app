# Beispiel für .streamlit/secrets.toml (nicht einchecken!)
# In Streamlit Cloud: Settings -> Secrets

APP_URL = "https://deine-wichtel-app.streamlit.app"
USE_MONGODB = "true"
MONGODB_URI = "mongodb+srv://user:pass@cluster.mongodb.net/"
DATABASE_NAME = "wichtel_app"

# Einmalig für den ersten Admin. Sobald ein Admin existiert, wird der
# Wert nicht mehr überschrieben.
ADMIN_EMAIL = "admin@example.com"
ADMIN_NAME = "Admin"
ADMIN_PASSWORD = "bitte-langes-passwort-setzen"

# Optional: Einladungs- und Startmails
SENDER_EMAIL = "deine.email@gmail.com"
SENDER_PASSWORD = "dein_app_passwort"
SMTP_SERVER = "smtp.gmail.com"
SMTP_PORT = "587"
